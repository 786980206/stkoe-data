[workspace]
resolver = "2"
members = [
    "crates/splayed-format",
    "crates/splayed-codec",
    "crates/splayed-core",
    "crates/splayed-arrow",
    "crates/splayed-adbc",
    "crates/splayed-datafusion",
    "crates/splayed-duckdb",
    "crates/splayed-polars",
    "crates/splayed",
    "crates/splayed-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
splayed-format = { path = "crates/splayed-format" }
splayed-codec = { path = "crates/splayed-codec" }
splayed-core = { path = "crates/splayed-core" }
splayed-arrow = { path = "crates/splayed-arrow" }
splayed-adbc = { path = "crates/splayed-adbc" }
splayed-datafusion = { path = "crates/splayed-datafusion" }
splayed-duckdb = { path = "crates/splayed-duckdb" }
splayed-polars = { path = "crates/splayed-polars" }

# Arrow stack (pinned to match DataFusion 55)
arrow = "59"
arrow-array = "59"
arrow-schema = "59"
half = "2"

# DataFusion
datafusion = "55"
