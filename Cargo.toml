[workspace]
resolver = "2"
members = [
    "crates/splayed-format",
    "crates/splayed-codec",
    "crates/splayed-core",
    "crates/splayed-table",
    "crates/splayed-arrow",
]
# V1 遗留 crate（V1.0 分支归档，待 2.0 模块对齐阶段重新设计后回归）
exclude = [
    "crates/splayed",
    "crates/splayed-adbc",
    "crates/splayed-arrow",
    "crates/splayed-cli",
    "crates/splayed-datafusion",
    "crates/splayed-duckdb",
    "crates/splayed-polars",
    "crates/splayed-python",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
authors = ["windsing"]
