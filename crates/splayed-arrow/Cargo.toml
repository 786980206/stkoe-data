[package]
name = "splayed-arrow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Splayed V2.0 Arrow conversion layer: core data model <-> Arrow RecordBatch"

[dependencies]
splayed-core = { path = "../splayed-core" }
splayed-table = { path = "../splayed-table" }
splayed-format = { path = "../splayed-format" }
arrow-array = "56"
arrow-buffer = "56"
arrow-schema = "56"
arrow-select = "56"
bytemuck = "1"
ahash = "0.8"

[dev-dependencies]
parquet = { version = "56", default-features = false, features = ["arrow"] }
