[package]
name = "splayed-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line tool for Splayed V1 (create datasets, run SQL queries)"

[[bin]]
name = "splayed"
path = "src/main.rs"

[dependencies]
splayed-format.workspace = true
splayed-core.workspace = true
splayed-arrow.workspace = true
splayed-datafusion.workspace = true
splayed-duckdb.workspace = true
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
datafusion = { workspace = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
clap = { version = "4", features = ["derive"] }
arrow-csv = "59"
