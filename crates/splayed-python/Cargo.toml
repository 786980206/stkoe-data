[package]
name = "splayed-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Python bindings (pyo3) for Splayed V1, backed by splayed-arrow + pyarrow"

[lib]
# 默认只出 rlib（cargo test / clippy 零 MSVC 链接告警，与 DuckDB 同款约定）。
# 生成 Python 扩展 `.pyd` 用 build_pyd.ps1（经变量传 --config，避免 PowerShell 剥引号）：
#   pwsh -File crates/splayed-python/build_pyd.ps1
name = "splayed"
crate-type = ["rlib"]

[features]
# 发布 .pyd 时不链接 libpython（默认关闭，便于 `cargo test` 内嵌解释器）：
#   cargo build -p splayed-python --release --features extension-module
extension-module = ["pyo3/extension-module"]

[dependencies]
splayed-format.workspace = true
splayed-core.workspace = true
splayed-arrow.workspace = true
arrow = { workspace = true, features = ["pyarrow"] }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
pyo3 = { version = "0.29", features = ["macros", "auto-initialize"] }
