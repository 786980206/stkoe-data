[package]
name = "splayed-table"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Splayed V2.0 table layer: Table / Partition organization, pruning, scan-read scheduling (per docs/splayed-table.md)"

[dependencies]
splayed-core = { path = "../splayed-core" }
splayed-format = { path = "../splayed-format" }
bytemuck = "1"

[dev-dependencies]
bytemuck = "1"
criterion = "0.5"
parquet = { version = "56", default-features = false, features = ["arrow", "snap", "zstd"] }
arrow-array = "56"
arrow-schema = "56"

[[bench]]
name = "vs_parquet"
harness = false
