[package]
name = "splayed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Splayed umbrella：引擎无关核心 + 上层 ADBC 驱动 + 引擎适配（datafusion/duckdb）"

[dependencies]
splayed-format.workspace = true
splayed-codec.workspace = true
splayed-core.workspace = true
splayed-arrow = { workspace = true, optional = true }
splayed-datafusion = { workspace = true, optional = true }
splayed-duckdb = { workspace = true, optional = true }
splayed-polars = { workspace = true, optional = true }
splayed-adbc = { workspace = true, optional = true }

[features]
default = ["arrow"]
# 共享转换工具库（被需要 Arrow 的适配层复用；纯核心场景可关闭）。
arrow = ["dep:splayed-arrow"]
# 上层 ADBC 驱动（内部经 DataFusion 执行 SQL → Arrow 结果；隐式拉入 datafusion）。
adbc = ["dep:splayed-adbc"]
# DataFusion TableProvider + SQL 执行能力。
datafusion = ["dep:splayed-datafusion"]
# DuckDB 扩展 / 桥。
duckdb = ["dep:splayed-duckdb"]
# Polars 惰性扫描（AnonymousScan：谓词下推 + 列裁剪）。
polars = ["dep:splayed-polars"]